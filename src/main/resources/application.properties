server.port=${PORT:3000}

# --- Database (override via environment) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musicquiz}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# --- Telegram bot: token MUST come from the environment, never commit it ---
bot.name=${BOT_NAME:MQIZ_BOT}
bot.token=${BOT_TOKEN:}
